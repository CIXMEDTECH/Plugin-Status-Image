<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { --fg: #15171c; --muted: #5f6573; --faint: #9aa0ac; --line: #e2e0da; --soft: rgba(0, 0, 0, 0.035); --field: #ffffff; --accent: #c7841a; --bad: #dc3d43; color-scheme: light; }
      :root.dark { --fg: #e8eaef; --muted: #9aa1ae; --faint: #636a77; --line: #2a2f39; --soft: rgba(255, 255, 255, 0.04); --field: #1a1d24; --bad: #f0575d; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 4px; font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); background: transparent; }
      p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
      .tabs { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; background: var(--field); }
      .tabs button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
      .tabs button[aria-selected="true"] { background: var(--soft); color: var(--fg); font-weight: 500; box-shadow: 0 0 0 1px var(--line); }
      .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
      select, input, button.act { height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: inherit; font: inherit; font-size: 13px; }
      button.act { cursor: pointer; font-weight: 500; transition: transform 0.1s ease-out; }
      button.act:active { transform: scale(0.97); }
      .preview { display: flex; align-items: center; justify-content: center; min-height: 72px; padding: 18px; border: 1px dashed var(--line); border-radius: 10px; margin-bottom: 14px; background: var(--soft); overflow: auto; }
      .preview img { max-width: 100%; height: auto; }
      .code { display: flex; gap: 8px; }
      .code input { flex: 1; min-width: 0; font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; }
      .note { margin: 12px 0 0; font-size: 12px; color: var(--faint); }
    </style>
  </head>
  <body>
    <p id="about"></p>
    <div id="tool">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="opts" id="opts"></div>
      <div class="preview"><img id="img" alt="" /></div>
      <div class="code">
        <select id="format" aria-label="format">
          <option value="markdown">Markdown</option>
          <option value="html">HTML</option>
          <option value="url"></option>
        </select>
        <input id="code" readonly />
        <button class="act" id="copy"></button>
      </div>
      <p class="note" id="note"></p>
    </div>
    <script src="_sdk.js"></script>
    <script>
      const TEXT = {
        zh: {
          about: "把节点的实时状态做成图片，贴到 README、论坛签名或网站里。图片每次被加载时都是当时的状态。",
          tabs: { badge: "节点徽章", page: "状态页徽章", card: "节点卡片", board: "状态看板" },
          status: "在线状态", uptime: "可用率（30 天）", light: "浅色", dark: "深色", allGroups: "全部分组",
          url: "图片地址", copy: "复制", none: "没有可用的项目",
          types: { svg: "SVG", png: "PNG", jpg: "JPEG", mjpeg: "MJPEG 实时流" },
          every: (s) => `每 ${s} 秒刷新`, normal: "标准大小", sharp: "高清（2 倍）",
          note: "隐藏的节点不会出现在任何图片里，私有站点也可以使用。卡片和看板上是否显示用量、图片地址前缀，在这个插件的设置里修改。",
          live: "MJPEG 实时流贴出去后会自己不停刷新，适合论坛签名和网页；GitHub 这类会缓存图片的网站不支持，请用 SVG 或 PNG。",
        },
        en: {
          about: "Live node status as images, to put in a README, a forum signature or a site. Each time an image loads it shows the state at that moment.",
          tabs: { badge: "Node badge", page: "Status page badge", card: "Node card", board: "Status board" },
          status: "Online or offline", uptime: "Availability (30 days)", light: "Light", dark: "Dark", allGroups: "All groups",
          url: "Image address", copy: "Copy", none: "Nothing to show yet",
          types: { svg: "SVG", png: "PNG", jpg: "JPEG", mjpeg: "MJPEG live stream" },
          every: (s) => `Refresh every ${s}s`, normal: "Normal size", sharp: "Sharp (2×)",
          note: "Hidden nodes never appear in any image; images work on a private site too. Whether cards and the board show usage, and the image address prefix, are set in this plugin's settings.",
          live: "A live MJPEG stream keeps refreshing itself once embedded, for forum signatures and web pages. Sites that cache images, such as GitHub, cannot show it: use SVG or PNG there.",
        },
      };
      const $ = (id) => document.getElementById(id);
      let t = TEXT.en, ctx = null, data = null, kind = "badge";
      const pick = { node: "", page: "", metric: "status", theme: "light", group: "", type: "svg", interval: "", scale: "1" };

      function option(value, label) {
        return new Option(label, value);
      }
      function select(key, options) {
        const s = document.createElement("select");
        s.replaceChildren(...options.map(([v, l]) => option(v, l)));
        if (!options.some(([v]) => v === pick[key])) pick[key] = options.length ? options[0][0] : "";
        s.value = pick[key];
        s.onchange = () => {
          pick[key] = s.value;
          draw();
        };
        return s;
      }
      /** The image's path and the page it should link to. */
      function target() {
        const q = new URLSearchParams();
        if (ctx.lang === "zh") q.set("lang", "zh");
        const ext = pick.type;
        if (ext !== "svg" && pick.scale === "2") q.set("scale", "2");
        if (ext === "mjpeg" && pick.interval) q.set("interval", pick.interval);
        if (kind === "badge" || kind === "card") {
          const n = data.nodes.find((x) => x.uuid === pick.node);
          if (!n) return null;
          if (kind === "badge" && pick.metric === "uptime") q.set("metric", "uptime");
          if (kind === "card" && pick.theme === "dark") q.set("theme", "dark");
          return { path: `/${kind === "badge" ? "badge/node" : "card"}/${n.uuid}.${ext}`, q, link: `/node/${n.uuid}`, name: n.name };
        }
        if (kind === "page") {
          const p = data.pages.find((x) => x.slug === pick.page);
          if (!p) return null;
          if (pick.metric === "uptime") q.set("metric", "uptime");
          return { path: `/badge/page/${p.slug}.${ext}`, q, link: `/${p.slug}`, name: p.title };
        }
        if (pick.theme === "dark") q.set("theme", "dark");
        if (pick.group) q.set("group", pick.group);
        return { path: `/board.${ext}`, q, link: "/", name: "status" };
      }
      function draw() {
        $("tabs").replaceChildren(
          ...Object.keys(t.tabs).map((k) => {
            const b = document.createElement("button");
            b.textContent = t.tabs[k];
            b.setAttribute("role", "tab");
            b.setAttribute("aria-selected", String(k === kind));
            b.onclick = () => {
              kind = k;
              draw();
            };
            return b;
          }),
        );
        const opts = [];
        if (kind === "badge" || kind === "card") opts.push(select("node", data.nodes.map((n) => [n.uuid, n.name])));
        if (kind === "page") opts.push(select("page", data.pages.map((p) => [p.slug, p.title])));
        if (kind === "badge" || kind === "page") opts.push(select("metric", [["status", t.status], ["uptime", t.uptime]]));
        if (kind === "card" || kind === "board") opts.push(select("theme", [["light", t.light], ["dark", t.dark]]));
        if (kind === "board" && data.groups.length) opts.push(select("group", [["", t.allGroups], ...data.groups.map((g) => [g, g])]));
        const types = ["svg", "png", "jpg"].concat(data.live ? ["mjpeg"] : []);
        opts.push(select("type", types.map((x) => [x, t.types[x]])));
        if (pick.type === "mjpeg") {
          const steps = [2, 5, 10, 30, 60].filter((s) => s >= data.live_interval);
          opts.push(select("interval", steps.map((s) => [String(s), t.every(s)])));
        }
        if (pick.type !== "svg") opts.push(select("scale", [["1", t.normal], ["2", t.sharp]]));
        $("opts").replaceChildren(...opts);
        $("note").textContent = pick.type === "mjpeg" ? `${t.note} ${t.live}` : t.note;
        const tg = target();
        const img = $("img"), code = $("code");
        if (!tg) {
          img.removeAttribute("src");
          img.alt = t.none;
          code.value = "";
          return vespera.resize();
        }
        const qs = tg.q.toString();
        // The preview comes from the panel as it is open now; the code uses the public
        // address: the image address prefix from the settings, or the site's own.
        const own = `/api/plugin/${ctx.plugin}`;
        img.src = `${ctx.origin}${own}${tg.path}${qs ? `?${qs}` : ""}`;
        img.alt = tg.name;
        img.onload = () => vespera.resize();
        const site = (data.url || ctx.origin).replace(/\/+$/, "");
        const prefix = data.base_url || `${site}${own}`;
        const src = `${prefix}${tg.path}${qs ? `?${qs}` : ""}`, href = `${site}${tg.link}`;
        const f = $("format").value;
        code.value = f === "markdown" ? `[![${tg.name}](${src})](${href})` : f === "html" ? `<a href="${href}"><img src="${src}" alt="${tg.name}"></a>` : src;
        vespera.resize();
      }
      $("format").onchange = draw;
      $("code").onfocus = () => $("code").select();
      $("copy").onclick = () => $("code").value && vespera.copy($("code").value);

      vespera.onContext(async (c) => {
        ctx = c;
        t = TEXT[c.lang] || TEXT.en;
        document.documentElement.style.setProperty("--accent", c.accent);
        $("about").textContent = t.about;
        $("copy").textContent = t.copy;
        $("format").options[2].textContent = t.url;
        data = (await vespera.fetch("/targets")).json();
        draw();
        vespera.resize();
      });
    </script>
  </body>
</html>
